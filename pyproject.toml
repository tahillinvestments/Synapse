[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-memory"
version = "2.6.0"
description = "Neuro-inspired Hierarchical & Temporal Code Memory Engine for AI Agents"
readme = "README.md"
authors = [
    { name = "tahillinvestments", email = "268229604+tahillinvestments@users.noreply.github.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["ai-memory", "knowledge-graph", "code-intelligence", "graphrag", "hipporag", "ast", "3d-visualization"]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
accelerated = [
    "networkx>=3.0",
    "numpy>=1.24",
]

[project.scripts]
synapse = "synapse.cli:main"

[project.urls]
Homepage = "https://github.com/tahillinvestments/synapse"
Repository = "https://github.com/tahillinvestments/synapse.git"
Issues = "https://github.com/tahillinvestments/synapse/issues"
